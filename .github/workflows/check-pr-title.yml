name: Check PR title

on:
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize

permissions:
  pull-requests: read

concurrency:
  # A newer push or title edit supersedes the run in progress.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    name: Validate PR title
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          ignoreLabels: |
            dependencies
          # The action's default types plus `deps`. The bots' configured prefixes
          # must all appear here: dependabot.yml uses `deps:` (swift) and `ci:`
          # (github-actions), renovate.json uses `deps:` (policy:
          # .claude/rules/project.md, Toolchain Pinning;
          # scripts/checks/dependency-bots-agree.sh checks it).
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
            deps
